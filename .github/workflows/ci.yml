name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun install mirrors the publish workflow and satisfies the engines of
      # @opentui/core (node >= 26.4 / bun >= 1.3), which npm on Node 24 only warns about.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify packaged TUI output
        run: npm run test:package
